name: Build project and run ctest

on:
  push:
    branches: [ "master" ]
    tags: [ "*" ]
  pull_request:
    branches: [ "master" ]

env:
  BUILD_TYPE: Release

jobs:
  linux:
    name: Build on Linux
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends --no-install-suggests autoconf autoconf-archive automake cmake libtool pkg-config

    - name: Restore vcpkg cache
      uses: actions/cache/restore@v6
      with:
        path: ~/.cache/vcpkg/archives
        key: vcpkg-${{runner.os}}-${{runner.arch}}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
        restore-keys: vcpkg-${{runner.os}}-${{runner.arch}}-

    - name: Configure CMake
      run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DBUILD_SHARED_LIBS:BOOL=on -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}} --parallel $(nproc) --verbose

    - name: Test
      run: ctest --test-dir ${{github.workspace}}/build --build-config ${{env.BUILD_TYPE}} --verbose

    - name: Save vcpkg cache
      uses: actions/cache/save@v6
      with:
        path: ~/.cache/vcpkg/archives
        key: vcpkg-${{runner.os}}-${{runner.arch}}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}

  macos:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [macos-15, macos-15-intel]

    steps:
    - uses: actions/checkout@v7

    - name: Install dependencies
      run: brew install autoconf autoconf-archive automake libtool pkg-config

    - name: Restore vcpkg cache
      uses: actions/cache/restore@v6
      with:
        path: ~/.cache/vcpkg/archives
        key: vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
        restore-keys: vcpkg-${{ runner.os }}-${{ runner.arch }}-

    - name: Configure CMake
      run: cmake -B ${GITHUB_WORKSPACE}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DBUILD_SHARED_LIBS:BOOL=on -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

    - name: Build
      run: cmake --build ${GITHUB_WORKSPACE}/build --config ${{env.BUILD_TYPE}} --parallel $(sysctl -n hw.ncpu) --verbose

    - name: Test
      run: ctest --test-dir ${GITHUB_WORKSPACE}/build --build-config ${{env.BUILD_TYPE}} --verbose

    - name: Save vcpkg cache
      uses: actions/cache/save@v6
      with:
        path: ~/.cache/vcpkg/archives
        key: vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}

  windows:
    name: Build and package for Windows ${{matrix.arch}}
    runs-on: windows-latest

    permissions:
      contents: write

    strategy:
      matrix:
        include:
          - arch: x64
            triplet: x64-windows
          - arch: Win32
            triplet: x86-windows

    steps:
    - uses: actions/checkout@v7

    - name: Set vcpkg binary cache path
      run: |
        New-Item -ItemType Directory -Force "$env:APPDATA\vcpkg\archives" | Out-Null
        echo "VCPKG_DEFAULT_BINARY_CACHE=$env:APPDATA\vcpkg\archives" >> "$env:GITHUB_ENV"

    - name: Restore vcpkg cache
      uses: actions/cache/restore@v6
      with:
        path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
        key: vcpkg-${{runner.os}}-${{runner.arch}}-${{matrix.triplet}}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
        restore-keys: vcpkg-${{runner.os}}-${{runner.arch}}-${{matrix.triplet}}-

    - name: Configure CMake
      run: cmake -A ${{matrix.arch}} -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DBUILD_SHARED_LIBS:BOOL=on -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=${{matrix.triplet}} -DVCPKG_HOST_TRIPLET=x64-windows -DVCPKG_USE_HOST_TOOLS=ON

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}} --verbose

    - name: Test
      run: ctest --test-dir ${{github.workspace}}/build --build-config ${{env.BUILD_TYPE}} --verbose

    - name: Build package
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}} --target package

    - name: Store the package
      uses: actions/upload-artifact@v7
      with:
        name: package for Windows ${{matrix.arch}}
        path: build/libopenvizsla-*.zip

    - name: Release the package
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v3
      with:
        files: build/libopenvizsla-*.zip

    - name: Save vcpkg cache
      uses: actions/cache/save@v6
      with:
        path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
        key: vcpkg-${{runner.os}}-${{runner.arch}}-${{matrix.triplet}}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
